<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="지도에서 등기 자료 조회와 변동 알림을 검증하는 등기로 MVP">
    <title>등기로 — 지도에서 등기 찾기</title>
    <link rel="icon" href="/assets/images/favicon-light.png?v=2" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="/assets/images/favicon-dark.png?v=2" type="image/png" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/assets/images/favicon-light.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="/assets/images/favicon-dark.png?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-brand">
        <a class="brand-link" href="/" aria-label="등기로 홈"><img src="/assets/images/logo.png" width="108" height="47" alt="등기로"></a>
        <span class="environment-label">MVP 검증</span>
      </div>
      <nav aria-label="주요 메뉴" class="navigation">
        <button type="button" data-action="page" data-id="map" aria-current="page">등기 찾기</button>
        <button type="button" data-action="page" data-id="guide">이용 가이드</button>
        <button type="button" data-action="page" data-id="watch" data-auth-only hidden>관심 부동산</button>
        <button type="button" data-action="page" data-id="alerts" data-auth-only hidden>알림<span id="unread-count" hidden></span></button>
        <button type="button" class="nav-account" data-action="page" data-id="profile" data-auth-only hidden>내 정보</button>
        <button type="button" id="nav-auth" class="nav-account" data-action="page" data-id="login" hidden>로그인</button>
      </nav>
    </header>

    <div id="mode-switcher" class="mode-switcher" role="tablist" aria-label="탐색 모드 전환">
      <button type="button" role="tab" data-action="page" data-id="map" aria-selected="true" class="is-active">지도 검색</button>
      <button type="button" role="tab" data-action="page" data-id="search" aria-selected="false">간편 검색</button>
    </div>

    <main id="map-page" class="map-workspace">
      <section class="map-stage" aria-label="위치 지도">
        <div id="map-live" class="map-layer" hidden></div>
        <div id="map-demo" class="map-layer">
          <canvas aria-hidden="true"></canvas>
          <div id="demo-pins" class="pin-layer"></div>
        </div>
        <p id="map-mode" class="map-mode" role="status">검증용 지도</p>
        <div class="map-tools" aria-label="지도 조작">
          <div class="zoom-group">
            <button type="button" data-action="zoom-in" aria-label="지도 확대">+</button>
            <button type="button" data-action="zoom-out" aria-label="지도 축소">−</button>
          </div>
          <button type="button" data-action="map-reset" aria-label="기본 지도 위치로 이동"><span class="icon icon-locate" aria-hidden="true"></span></button>
          <div class="layer-group" aria-label="지도 레이어">
            <button type="button" id="toggle-satellite" data-action="toggle-satellite" aria-pressed="false" title="위성지도 전환">위성</button>
            <button type="button" id="toggle-cadastral" data-action="toggle-cadastral" aria-pressed="false" title="지적편집도 표시">지적</button>
          </div>
        </div>
        <div id="map-breadcrumb" class="map-breadcrumb" aria-live="polite"></div>
        <div id="map-caption" class="map-caption">검증용 지도 · 실제 지형과 다를 수 있어요</div>
      </section>
      <aside class="map-overlay" aria-label="지도 검색과 등기 상세">
        <div class="floating-search">
          <h1 class="sr-only">지도에서 등기 찾기</h1>
          <form id="search-form" class="search-form" role="search">
            <span class="search-leading" aria-hidden="true"><span class="icon icon-search"></span></span>
            <label for="search-query" class="sr-only">주소·지번·건물명</label>
            <input id="search-query" type="search" placeholder="주소, 지번, 건물명으로 등기 찾기" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest">
            <button type="button" id="search-clear" class="search-clear" data-action="clear-search" aria-label="검색어 지우기" hidden>×</button>
            <button type="submit" class="search-submit" aria-label="검색">검색</button>
          </form>
          <div id="search-suggest" class="search-suggest" role="listbox" aria-label="추천 검색어" hidden></div>
          <p id="search-feedback" class="search-feedback" role="status" hidden></p>
          <div id="quick-tray" class="quick-tray">
            <div id="popular-bar" class="quick-section" aria-label="인기 주소"></div>
            <div id="recent-bar" class="quick-section quick-section-recent" aria-label="최근 본 부동산" hidden></div>
          </div>
        </div>
        <section id="results-panel" class="results-panel" aria-label="검색 결과 및 등기 상세" data-open="true"></section>
      </aside>
      <button type="button" id="drawer-toggle" class="drawer-toggle" data-action="drawer-toggle" aria-label="좌측 패널 열기" aria-expanded="false" aria-controls="results-panel"><span class="drawer-arrow" aria-hidden="true"></span></button>
    </main>

    <main id="sub-page" class="sub-page" hidden></main>
    <button type="button" id="fab-auto-upload" class="fab-auto-upload" data-action="auto-upload" aria-label="등기 파일 자동 등록">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
      <span>등기 자동 등록</span>
    </button>
    <dialog id="action-dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="noscript">등기로를 이용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  </body>
</html>
